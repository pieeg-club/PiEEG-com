  .bar button.on{background:#1b2230;color:#fff}
  .bar i{width:1px;background:#dde2ea;margin:4px 2px}
  .hint{position:absolute;right:18px;top:18px;font-size:12px;color:#6b7585;font-weight:600;text-align:right;pointer-events:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:#6b7585}
  .title,.hint{display:none}
  .bar{bottom:10px;gap:2px;padding:4px;flex-wrap:nowrap}
  .bar button{padding:7px 9px;font-size:12px;white-space:nowrap}
  @media (max-width:520px){[data-view=front],[data-view=side]{display:none}.bar button{padding:6px 8px}}
  @media (max-width:560px){.hint{display:none}.title b{font-size:17px}}
