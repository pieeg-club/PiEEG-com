<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OctoBio Kit — Interactive 3D Model</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:#1b2230;background:#fff}
  #stage{position:relative;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(ellipse at 50% 38%,#ffffff 0%,#eef1f6 60%,#dfe5ee 100%)}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .bar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;flex-wrap:nowrap;
    background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid #dde2ea;border-radius:14px;padding:4px;box-shadow:0 6px 24px rgba(20,30,50,.08);max-width:calc(100% - 16px)}
  .bar button{border:0;background:transparent;font:600 12px/1 inherit;color:#334;padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .bar button:hover{background:#eef1f6}
  .bar button.on{background:#1b2230;color:#fff}
  .bar i{width:1px;background:#dde2ea;margin:4px 2px}
  #pins{position:absolute;inset:0;pointer-events:none}
  .pl{position:absolute;left:0;top:0;min-width:22px;height:22px;padding:0 5px;border-radius:11px;font:700 11px/22px inherit;text-align:center;color:#fff;opacity:0;transition:opacity .25s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .pl.a{background:#2563eb}.pl.b{background:#0e9f6e}.pl.ref{background:#7c3aed}.pl.gnd{background:#475467}
  #tip{position:absolute;left:0;top:0;pointer-events:none;background:rgba(255,255,255,.95);border:1px solid #dde2ea;border-radius:9px;padding:7px 10px;font-size:12.5px;opacity:0;transition:opacity .15s;box-shadow:0 4px 14px rgba(20,30,50,.1);max-width:240px}
  #tip b{display:block}#tip span{color:#5d6778;font-size:11.5px;font-weight:500}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:#6b7585}
  @media (max-width:520px){[data-view=pins]{display:none}.bar button{padding:7px 8px}.pl{min-width:18px;height:18px;font-size:9.5px;line-height:18px}}
</style></head>
<body>
<div id="stage">
  <div id="loading">Loading 3D model…</div>
  <div id="pins"></div>
  <div id="tip"></div>
  <div class="bar">
    <button data-view="kit" class="on">Kit</button>
    <button data-view="board">Board</button>
    <button data-view="octo">Octopus</button>
    <button data-view="pins">Pins</button>
    <i></i>
    <button id="lid">Close lid</button>
    <button id="spin">Spin</button>
  </div>
</div>
