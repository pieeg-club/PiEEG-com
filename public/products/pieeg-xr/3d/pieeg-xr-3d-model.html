<style>
  *{box-sizing:border-box}

  .bar button.on{background:#1b2230;color:#fff}

    border:1px solid #dde2ea;border-radius:8px;padding:5px 9px;white-space:nowrap;opacity:0;transition:opacity .2s;box-shadow:0 4px 14px rgba(20,30,50,.08)}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:#6b7585}
  @media (max-width:520px){[data-view=side],[data-view=front],#replay,.hint{display:none}.bar button{padding:7px 8px}.lbl{font-size:11px}}
  .title,.hint{display:none} .lbl.ch,.lbl.ref{font-size:10px;padding:2px 5px;border-radius:6px} .lbl.part{font-size:11px;padding:4px 7px}
